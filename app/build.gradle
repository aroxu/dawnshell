apply plugin: 'com.android.application'

android {
    namespace "me.aroxu.dawnshell"

    compileSdk project.properties.compileSdkVersion.toInteger()

    def appVersionName = System.getenv("DAWNSHELL_APP_BUILD__APP_VERSION_NAME") ?: ""
    def apkVersionTag = System.getenv("DAWNSHELL_APP_BUILD__APK_VERSION_TAG") ?: ""

    defaultConfig {
        applicationId "me.aroxu.dawnshell"
        minSdk project.properties.minSdkVersion.toInteger()
        targetSdk project.properties.targetSdkVersion.toInteger()
        versionCode 2
        versionName "0.2.0"

        if (appVersionName) versionName = appVersionName
        validateVersionName(versionName)
    }

    signingConfigs {
        debug {
            storeFile file('testkey_untrusted.jks')
            keyAlias 'alias'
            storePassword 'xrj45yWGLbsO7W0v'
            keyPassword 'xrj45yWGLbsO7W0v'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }

        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = new File("dawnshell-app_" +
                    (apkVersionTag ? apkVersionTag : "v" + versionName + "+" + variant.buildType.name) + ".apk")
        }
    }
}

dependencies {
    implementation "androidx.annotation:annotation:1.7.0"
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "com.google.android.material:material:1.12.0"
    implementation "net.i2p.crypto:eddsa:0.3.0"

    testImplementation "junit:junit:4.13.2"
}

task versionName {
    doLast {
        print android.defaultConfig.versionName
    }
}

def bfuBootstrapAbis = ['armeabi-v7a', 'arm64-v8a', 'x86_64']
def bfuBootstrapExecutables = [
        'dawnshell-toolbox', 'pkgdetails', 'gpgv', 'bfu-namespace-probe']
def bfuBootstrapAssets = []
bfuBootstrapAbis.each { abi ->
    bfuBootstrapExecutables.each { executable ->
        bfuBootstrapAssets.add(file("src/main/assets/bfu/bin/${abi}/${executable}"))
    }
    bfuBootstrapAssets.add(file("src/main/assets/bfu/bin/${abi}/runtime.properties"))
}
bfuBootstrapAssets.add(file(
        'src/main/assets/bfu/bootstrap/debootstrap_1.0.141.tgz'))
bfuBootstrapAssets.add(file(
        'src/main/assets/bfu/bootstrap/debian-archive-keyring_2025.1_all.deb'))
bfuBootstrapAssets.add(file('src/main/assets/bfu/bootstrap/SOURCES.lock'))

tasks.register('verifyBfuBootstrapRuntime') {
    inputs.files(bfuBootstrapAssets)
    doLast {
        bfuBootstrapAssets.each { asset ->
            if (!asset.isFile()) {
                throw new GradleException("Missing BFU bootstrap asset: ${asset}")
            }
            if (asset.length() == 0) {
                throw new GradleException("Empty BFU bootstrap asset: ${asset}")
            }
        }
    }
}

tasks.named('preBuild').configure {
    dependsOn tasks.named('verifyBfuBootstrapRuntime')
}

def validateVersionName(String versionName) {
    // https://semver.org/spec/v2.0.0.html#is-there-a-suggested-regular-expression-regex-to-check-a-semver-string
    // ^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$
    if (!java.util.regex.Pattern.matches("^(0|[1-9]\\d*)\\.(0|[1-9]\\d*)\\.(0|[1-9]\\d*)(?:-((?:0|[1-9]\\d*|\\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\\.(?:0|[1-9]\\d*|\\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\\+([0-9a-zA-Z-]+(?:\\.[0-9a-zA-Z-]+)*))?\$", versionName))
        throw new GradleException("The versionName '" + versionName + "' is not a valid version as per semantic version '2.0.0' spec in the format 'major.minor.patch(-prerelease)(+buildmetadata)'. https://semver.org/spec/v2.0.0.html.")
}
