apply plugin: 'com.android.application'

android {
    namespace "me.aroxu.termux.bfu"

    compileSdk project.properties.compileSdkVersion.toInteger()

    def appVersionName = System.getenv("TERMUX_BFU_APP_BUILD__APP_VERSION_NAME") ?: ""
    def apkVersionTag = System.getenv("TERMUX_BFU_APP_BUILD__APK_VERSION_TAG") ?: ""

    defaultConfig {
        applicationId "me.aroxu.termux.bfu"
        minSdk project.properties.minSdkVersion.toInteger()
        targetSdk project.properties.targetSdkVersion.toInteger()
        versionCode 1
        versionName "0.1.0"

        if (appVersionName) versionName = appVersionName
        validateVersionName(versionName)
    }

    signingConfigs {
        debug {
            storeFile file('testkey_untrusted.jks')
            keyAlias 'alias'
            storePassword 'xrj45yWGLbsO7W0v'
            keyPassword 'xrj45yWGLbsO7W0v'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }

        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = new File("termux-bfu-app_" +
                    (apkVersionTag ? apkVersionTag : "v" + versionName + "+" + variant.buildType.name) + ".apk")
        }
    }
}

dependencies {
    implementation "androidx.annotation:annotation:1.7.0"
    implementation "net.i2p.crypto:eddsa:0.3.0"

    testImplementation "junit:junit:4.13.2"
}

task versionName {
    doLast {
        print android.defaultConfig.versionName
    }
}

def bfuNamespaceProbeAsset = file(
        'src/main/assets/bfu/bin/bfu-namespace-probe-arm64')

tasks.register('verifyBfuNamespaceProbe') {
    inputs.file(bfuNamespaceProbeAsset)
    doLast {
        if (!bfuNamespaceProbeAsset.isFile()) {
            throw new GradleException('Missing ARM64 BFU namespace probe asset')
        }
        if (bfuNamespaceProbeAsset.length() == 0) {
            throw new GradleException('Empty ARM64 BFU namespace probe asset')
        }
    }
}

tasks.named('preBuild').configure {
    dependsOn tasks.named('verifyBfuNamespaceProbe')
}

def validateVersionName(String versionName) {
    // https://semver.org/spec/v2.0.0.html#is-there-a-suggested-regular-expression-regex-to-check-a-semver-string
    // ^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$
    if (!java.util.regex.Pattern.matches("^(0|[1-9]\\d*)\\.(0|[1-9]\\d*)\\.(0|[1-9]\\d*)(?:-((?:0|[1-9]\\d*|\\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\\.(?:0|[1-9]\\d*|\\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\\+([0-9a-zA-Z-]+(?:\\.[0-9a-zA-Z-]+)*))?\$", versionName))
        throw new GradleException("The versionName '" + versionName + "' is not a valid version as per semantic version '2.0.0' spec in the format 'major.minor.patch(-prerelease)(+buildmetadata)'. https://semver.org/spec/v2.0.0.html.")
}
