name: Build and release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_NDK_VERSION: 29.0.14206865
  DAWNSHELL_SOURCE_REVISION: ${{ github.sha }}
  SOURCE_DATE_EPOCH: 1758672000

jobs:
  build:
    name: Source build and compliance checks
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    outputs:
      artifact-name: ${{ steps.metadata.outputs.artifact_name }}
      release-version: ${{ steps.metadata.outputs.version }}

    steps:
      - name: Check out exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install host and Android build tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            autoconf automake bison build-essential bzip2 gawk gettext gzip \
            curl libtool patch pkg-config unzip xz-utils
          shellcheck_version=0.11.0
          shellcheck_sha256=8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
          shellcheck_root="$RUNNER_TEMP/shellcheck-$shellcheck_version"
          shellcheck_archive="$RUNNER_TEMP/shellcheck-$shellcheck_version.tar.xz"
          curl --fail --location --retry 3 \
            --output "$shellcheck_archive" \
            "https://github.com/koalaman/shellcheck/releases/download/v$shellcheck_version/shellcheck-v$shellcheck_version.linux.x86_64.tar.xz"
          printf '%s  %s\n' "$shellcheck_sha256" "$shellcheck_archive" \
            | sha256sum -c -
          mkdir -p "$shellcheck_root"
          tar -xJf "$shellcheck_archive" -C "$shellcheck_root"
          shellcheck_path="$shellcheck_root/shellcheck-v$shellcheck_version/shellcheck"
          test -x "$shellcheck_path"
          echo "DAWNSHELL_SHELLCHECK=$shellcheck_path" >> "$GITHUB_ENV"
          # sdkmanager closes stdin after accepting its licenses. Ignore only
          # the expected SIGPIPE from yes; sdkmanager remains the pipeline's
          # status-bearing final command.
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;$ANDROID_NDK_VERSION" >/dev/null
          set -o pipefail
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" \
            >> "$GITHUB_ENV"

      - name: Resolve version and variant
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA:0:12}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)([-+][0-9A-Za-z.-]+)?$ ]]; then
              echo "Tag must be a semantic version prefixed with v: $GITHUB_REF_NAME" >&2
              exit 2
            fi
            version_code=$((1000000 + GITHUB_RUN_NUMBER))
            variant=release
            apk_suffix=
            artifact_name="dawnshell-release-${version}-${short_sha}"
            {
              echo "DAWNSHELL_APP_BUILD__APP_VERSION_NAME=$version"
              echo "DAWNSHELL_APP_BUILD__APP_VERSION_CODE=$version_code"
              echo "DAWNSHELL_APP_BUILD__APK_VERSION_TAG=v$version"
            } >> "$GITHUB_ENV"
          else
            version="$(./gradlew -q :app:versionName)"
            variant=debug
            apk_suffix=debug
            artifact_name="dawnshell-ci-${version}-${short_sha}"
          fi
          {
            echo "version=$version"
            echo "variant=$variant"
            echo "apk_suffix=$apk_suffix"
            echo "artifact_name=$artifact_name"
          } >> "$GITHUB_OUTPUT"

      - name: Configure private release signing
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.DAWNSHELL_RELEASE_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.DAWNSHELL_RELEASE_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.DAWNSHELL_RELEASE_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.DAWNSHELL_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for value in "$KEYSTORE_BASE64" "$KEY_ALIAS" "$STORE_PASSWORD" "$KEY_PASSWORD"; do
            if [[ -z "$value" ]]; then
              echo "All four DAWNSHELL_RELEASE_* secrets are required for a tag build." >&2
              exit 2
            fi
          done
          keystore="$RUNNER_TEMP/dawnshell-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          {
            echo "DAWNSHELL_RELEASE_STORE_FILE=$keystore"
            echo "DAWNSHELL_RELEASE_KEY_ALIAS=$KEY_ALIAS"
            echo "DAWNSHELL_RELEASE_STORE_PASSWORD=$STORE_PASSWORD"
            echo "DAWNSHELL_RELEASE_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build bootstrap runtime from pinned source
        shell: bash
        run: |
          set -euo pipefail
          "$DAWNSHELL_SHELLCHECK" --version
          "$DAWNSHELL_SHELLCHECK" scripts/*.sh app/src/main/assets/bfu/*.sh
          # Report which script failed. A bare list of commands collapses into
          # one opaque step failure that hides the actual stage.
          for stage in \
            scripts/test-release-compliance.sh \
            scripts/build-bootstrap-runtime.sh \
            scripts/test-hardware-codec-bridge.sh \
            scripts/test-ffmpeg-bridge-plan.sh \
            scripts/test-gpu-status-tool.sh \
            scripts/test-live-codec-pipeline.sh \
            scripts/test-host-reboot-isolation.sh \
            scripts/test-compatibility-policy.sh \
            scripts/test-rootfs-path-resolution.sh \
            scripts/test-lifecycle-control-policy.sh \
            scripts/test-documentation.sh ; do
            echo "::group::$stage"
            stage_log="$RUNNER_TEMP/$(basename "$stage").log"
            if ! "./$stage" 2>&1 | tee "$stage_log"; then
              echo "::endgroup::"
              echo "::error::failing stage: $stage"
              trace_log="$RUNNER_TEMP/$(basename "$stage").trace.log"
              set +e
              bash -x "./$stage" > "$trace_log" 2>&1
              trace_status=$?
              set -e
              trace_tail="$(tail -n 40 "$trace_log" | tr '\n' ' ' | tr '\r' ' ')"
              trace_tail="${trace_tail//'%'/'%25'}"
              trace_tail="${trace_tail//$'\r'/'%0D'}"
              trace_tail="${trace_tail//$'\n'/'%0A'}"
              echo "::error::failure trace exit=$trace_status: $trace_tail"
              # The job summary survives log-access restrictions, so record
              # the failing stage there as well.
              {
                echo "failing stage: $stage"
                echo "trace exit: $trace_status"
                echo
                echo '```text'
                tail -n 240 "$trace_log"
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            echo "::endgroup::"
          done

      - name: Build and test Android application
        id: apk
        shell: bash
        env:
          VARIANT: ${{ steps.metadata.outputs.variant }}
        run: |
          set -euo pipefail
          if [[ "$VARIANT" == release ]]; then
            ./gradlew --no-daemon clean \
              :app:assembleRelease :app:lintRelease :app:testDebugUnitTest
          else
            ./gradlew --no-daemon clean \
              :app:assembleDebug :app:lintDebug :app:testDebugUnitTest
          fi
          apk_path="$(find "app/build/outputs/apk/$VARIANT" \
            -maxdepth 1 -type f -name '*.apk' -print -quit)"
          [[ -n "$apk_path" && -s "$apk_path" ]]
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" \
            verify --verbose --print-certs "$apk_path"
          ./scripts/test-release-compliance.sh "$apk_path"
          echo "apk_path=$apk_path" >> "$GITHUB_OUTPUT"

      - name: Package APK, corresponding source, licenses and checksums
        shell: bash
        env:
          DAWNSHELL_RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
          DAWNSHELL_APK_SUFFIX: ${{ steps.metadata.outputs.apk_suffix }}
          APK_PATH: ${{ steps.apk.outputs.apk_path }}
        run: |
          set -euo pipefail
          ./scripts/package-release.sh "$APK_PATH" dist/release

      - name: Upload complete distribution set
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.metadata.outputs.artifact_name }}
          path: dist/release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  release:
    name: Publish GitHub release
    if: >-
      github.event_name != 'pull_request' &&
      (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Download verified build set
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: release-assets

      - name: Verify checksums again
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum -c SHA256SUMS

      - name: Publish stable or continuous release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.release-version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            gh release create "$GITHUB_REF_NAME" release-assets/* \
              --verify-tag \
              --draft \
              --title "DawnShell $VERSION" \
              --notes-file release-assets/RELEASE_NOTES.md
            gh release edit "$GITHUB_REF_NAME" --draft=false --latest
          elif gh release view continuous >/dev/null 2>&1; then
            gh api --method PATCH \
              "repos/$GH_REPO/git/refs/tags/continuous" \
              -f sha="$GITHUB_SHA" -F force=true >/dev/null
            gh release upload continuous release-assets/* --clobber
            while IFS= read -r asset; do
              if [[ ! -e "release-assets/$asset" ]]; then
                gh release delete-asset continuous "$asset" --yes
              fi
            done < <(gh release view continuous --json assets --jq '.assets[].name')
            gh release edit continuous \
              --title "DawnShell Continuous" \
              --notes-file release-assets/RELEASE_NOTES.md \
              --prerelease=false \
              --latest
          else
            gh release create continuous release-assets/* \
              --target "$GITHUB_SHA" \
              --title "DawnShell Continuous" \
              --notes-file release-assets/RELEASE_NOTES.md \
              --latest
          fi
